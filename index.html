<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>On Site</title>
  <meta name="description" content="Shoot-day companion for real estate photography.">
  <meta name="theme-color" content="#16202B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="On Site">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Mark iPhone / iPad (iPadOS reports itself as a Mac with touch) for the status bar fix in styles.css
    if (/iPad|iPhone|iPod/.test(navigator.userAgent) ||
      (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1)) {
      document.documentElement.classList.add('is-ios');
    }
  </script>
</head>
<body>
  <div id="status-bar-tint" aria-hidden="true"></div>
  <main id="app" aria-live="polite"></main>
  <div id="toast" role="status" hidden></div>
  <script src="parser.js"></script>
  <script src="sun.js"></script>
  <script src="app.js"></script>
</body>
</html>
